name: Run Tests
on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  unit_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      python_version: "3.12"
      install_extras: "audio"
      test_path: "test/unittests/"
      coverage_source: "ovoscope"
