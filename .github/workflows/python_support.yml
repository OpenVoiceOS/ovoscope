name: Python Support
on:
  pull_request:
    branches: [dev]
    paths:
      - 'pyproject.toml'
      - 'ovoscope/**'
  workflow_dispatch:

jobs:
  python_support:
    uses: OpenVoiceOS/gh-automations/.github/workflows/python-support.yml@dev
    with:
      package_name: "ovoscope"
      install_extras: "[pydantic]"
