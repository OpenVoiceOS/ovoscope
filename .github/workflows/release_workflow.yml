name: Release Alpha and Propose Stable

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  build_tests:
    if: (github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          pip install build pytest pytest-cov
          pip install -e .[pydantic]
      - name: Run unit tests
        run: pytest test/unittests/ -v --cov=ovoscope --cov-report xml

  publish_alpha:
    needs: build_tests
    if: (github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev'
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-alpha.yml@dev
    secrets: inherit
    with:
      branch: 'dev'
      version_file: 'ovoscope/version.py'
      update_changelog: true
      publish_prerelease: true
      propose_release: true
      changelog_max_issues: 100
      publish_pypi: true
      notify_matrix: true
