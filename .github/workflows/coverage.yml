name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      coverage_source: 'ovoscope'
      test_path: 'test/unittests/'
      test_extras: 'audio,pydantic,media,listener,bench'
      min_coverage: 0
      # TEMPORARY until ovos-plugin-manager 3.0.0a1 + ovos-media release the
      # MediaBackend v2 port; then delete. See build-tests.yml's matching
      # comment for why this is needed even with the media extra above.
      pre_install_pip: "git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/media-backend-v2 git+https://github.com/OpenVoiceOS/ovos-media@feat/media-backend-v2-port"
