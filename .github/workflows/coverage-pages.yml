name: Coverage Pages
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  # The reusable coverage job requests both; a called workflow cannot hold
  # more than its caller grants, so a missing one fails the run at startup.
  contents: write
  pull-requests: write

jobs:
  coverage_pages:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      python_version: "3.12"
      test_path: "test/unittests/"
      coverage_source: "ovoscope"
      install_extras: "audio,pydantic"
      deploy_pages: true
